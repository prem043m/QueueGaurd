apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: queueguard
  labels: { app: auth-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: auth-service
          image: queueguard/auth-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8081, name: http }
          envFrom:
            - configMapRef: { name: queueguard-config }
            - secretRef: { name: queueguard-secret }
          env:
            - { name: SERVER_PORT, value: "8081" }
            - { name: DB_NAME, value: auth_db }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 45
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: queueguard
spec:
  selector: { app: auth-service }
  ports:
    - { name: http, port: 8081, targetPort: 8081 }
