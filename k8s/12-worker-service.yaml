apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  namespace: queueguard
  labels: { app: worker-service }
spec:
  # Workers are stateless and claim atomically from the shared queue,
  # so scaling them horizontally is always safe (HPA target below).
  replicas: 2
  selector:
    matchLabels: { app: worker-service }
  template:
    metadata:
      labels: { app: worker-service }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: worker-service
          image: queueguard/worker-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8083, name: http }
          envFrom:
            - configMapRef: { name: queueguard-config }
            - secretRef: { name: queueguard-secret }
          env:
            - { name: SERVER_PORT, value: "8083" }
            - { name: DB_NAME, value: worker_db }
            - name: WORKER_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 45
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: worker-service
  namespace: queueguard
spec:
  selector: { app: worker-service }
  ports:
    - { name: http, port: 8083, targetPort: 8083 }
