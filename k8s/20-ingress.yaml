# OPTIONAL: HTTPS-ready ingress (requires the ingress-nginx addon).
#   minikube addons enable ingress
# Then browse http://queueguard.local (add to /etc/hosts -> ingress IP).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: queueguard-ingress
  namespace: queueguard
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/proxy-body-size: "256k"
spec:
  ingressClassName: nginx
  rules:
    - host: queueguard.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
