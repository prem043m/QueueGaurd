apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-service
  namespace: queueguard
  labels: { app: queue-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: queue-service }
  template:
    metadata:
      labels: { app: queue-service }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: queue-service
          image: queueguard/queue-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8082, name: http }
          envFrom:
            - configMapRef: { name: queueguard-config }
            - secretRef: { name: queueguard-secret }
          env:
            - { name: SERVER_PORT, value: "8082" }
            - { name: DB_NAME, value: queue_db }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 50
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 640Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: queue-service
  namespace: queueguard
spec:
  selector: { app: queue-service }
  ports:
    - { name: http, port: 8082, targetPort: 8082 }
