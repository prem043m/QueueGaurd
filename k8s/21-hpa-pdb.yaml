# Horizontal Pod Autoscalers: the gateway absorbs traffic bursts/attacks,
# workers scale with queue depth. CPU is the simple signal here; production
# setups can add custom metrics (e.g. queue depth via Prometheus adapter).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: queueguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-service-hpa
  namespace: queueguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
# PodDisruptionBudgets keep the system available during node drains/upgrades.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: queueguard
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: api-gateway }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: queue-service-pdb
  namespace: queueguard
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: queue-service }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-service-pdb
  namespace: queueguard
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: worker-service }
