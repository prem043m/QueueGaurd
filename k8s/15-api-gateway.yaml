apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: queueguard
  labels: { app: api-gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: api-gateway
          image: queueguard/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8080, name: http }
          envFrom:
            - configMapRef: { name: queueguard-config }
            - secretRef: { name: queueguard-secret }
          env:
            - { name: SERVER_PORT, value: "8080" }
            - { name: DB_NAME, value: gateway_db }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 45
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 640Mi }
            limits: { cpu: "1", memory: 1Gi }
---
# Single public entry point. On Minikube: `minikube tunnel` (LoadBalancer IP)
# or `minikube service api-gateway -n queueguard --url`.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: queueguard
spec:
  type: LoadBalancer
  selector: { app: api-gateway }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
