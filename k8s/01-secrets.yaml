# NOTE: plain stringData for demo convenience. In production use:
#   kubectl create secret generic queueguard-secret -n queueguard \
#     --from-literal=DB_PASSWORD=... --from-literal=JWT_SECRET=...
# or seal it with Sealed Secrets / External Secrets Operator.
apiVersion: v1
kind: Secret
metadata:
  name: queueguard-secret
  namespace: queueguard
type: Opaque
stringData:
  DB_PASSWORD: "queueguard"
  JWT_SECRET: "queueguard-k8s-secret-change-me-please-01"
