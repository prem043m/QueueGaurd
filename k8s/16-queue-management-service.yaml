apiVersion: apps/v1
kind: Deployment
metadata: { name: queue-management-service, namespace: queueguard }
spec:
  replicas: 1
  selector: { matchLabels: { app: queue-management-service } }
  template:
    metadata: { labels: { app: queue-management-service } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1001, fsGroup: 1001 }
      containers:
        - name: queue-management-service
          image: queueguard/queue-management-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8086, name: http }]
          envFrom:
            - configMapRef: { name: queueguard-config }
            - secretRef: { name: queueguard-secret }
          env:
            - { name: DB_NAME, value: qms_db }
            - { name: SERVER_PORT, value: "8086" }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 15, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 45, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: queue-management-service, namespace: queueguard }
spec:
  selector: { app: queue-management-service }
  ports: [{ name: http, port: 8086, targetPort: 8086 }]
