management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
  info:
    env:
      enabled: true
    app:
      name: ${spring.application.name:queueguard}
      version: ${APP_VERSION:1.0.0}
      environment: ${DEPLOYMENT_ENV:local}
  metrics:
    tags:
      application: ${spring.application.name:queueguard}
      environment: ${DEPLOYMENT_ENV:local}
      version: ${APP_VERSION:1.0.0}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
jdbc:
  includes: QUERY
  datasource-proxy:
    include-parameter-values: false
