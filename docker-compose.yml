# QueueGuard - full local stack (6 microservices + PostgreSQL + Redis).
# Run from the repo root:  docker compose up --build
name: queueguard

x-common-env: &common-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: queueguard
  DB_PASSWORD: queueguard
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  JWT_SECRET: queueguard-dev-secret-change-me-in-prod-01
  AUTH_SERVICE_URL: http://auth-service:8081
  QUEUE_SERVICE_URL: http://queue-service:8082
  WORKER_SERVICE_URL: http://worker-service:8083
  RATE_LIMIT_SERVICE_URL: http://rate-limit-service:8084
  MONITOR_SERVICE_URL: http://monitor-service:8085
  QMS_SERVICE_URL: http://queue-management-service:8086
  DEPLOYMENT_ENV: local
  APP_VERSION: ${APP_VERSION:-1.0.0}
  MANAGEMENT_SERVER_PORT: "9090"
  TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: queueguard
      POSTGRES_PASSWORD: queueguard
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueguard -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api-gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args: { SERVICE_NAME: api-gateway }
    image: queueguard/api-gateway:1.0.0
    environment:
      <<: *common-env
      DB_NAME: gateway_db
      TRUST_PROXY_HEADERS: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  auth-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args: { SERVICE_NAME: auth-service }
    image: queueguard/auth-service:1.0.0
    environment:
      <<: *common-env
      DB_NAME: auth_db
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  queue-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args: { SERVICE_NAME: queue-service }
    image: queueguard/queue-service:1.0.0
    environment:
      <<: *common-env
      DB_NAME: queue_db
      QUEUE_BOOTSTRAP_DEFAULT_QUEUE: "true"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args: { SERVICE_NAME: worker-service }
    image: queueguard/worker-service:1.0.0
    environment:
      <<: *common-env
      DB_NAME: worker_db
      WORKER_ID: worker-1
      WORKER_QUEUES: default
      WORKER_MAX_CONCURRENCY: "8"
    depends_on:
      queue-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  rate-limit-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args: { SERVICE_NAME: rate-limit-service }
    image: queueguard/rate-limit-service:1.0.0
    environment:
      <<: *common-env
      DB_NAME: ratelimit_db
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  monitor-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args: { SERVICE_NAME: monitor-service }
    image: queueguard/monitor-service:1.0.0
    environment:
      <<: *common-env
      DB_NAME: monitor_db
      MONITOR_TARGETS: api-gateway=http://api-gateway:8080,auth-service=http://auth-service:8081,queue-service=http://queue-service:8082,worker-service=http://worker-service:8083,rate-limit-service=http://rate-limit-service:8084,queue-management-service=http://queue-management-service:8086
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  queue-management-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args: { SERVICE_NAME: queue-management-service }
    image: queueguard/queue-management-service:1.0.0
    environment:
      <<: *common-env
      DB_NAME: qms_db
      SERVER_PORT: "8086"
      OUTBOX_CONSUMER_ENABLED: "true"
    ports:
      - "8086:8086"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.0
    profiles: ["observability"]
    environment:
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus: { condition: service_healthy }
      loki: { condition: service_started }
      tempo: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      tempo: { condition: service_started }
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.2
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.8
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./deploy/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.22.0
    profiles: ["observability"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./deploy/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloydata:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  prometheusdata:
  grafanadata:
  tempodata:
  lokidata:
  alloydata:
