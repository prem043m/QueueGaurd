server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: queue-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:queue_db}
    username: ${DB_USER:queueguard}
    password: ${DB_PASSWORD:queueguard}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

queueguard:
  visibility-timeout-ms: ${VISIBILITY_TIMEOUT_MS:60000}
  reaper-interval-ms: ${REAPER_INTERVAL_MS:15000}
  reconcile-interval-ms: ${RECONCILE_INTERVAL_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.queueguard: INFO
