server:
  port: ${SERVER_PORT:8085}

spring:
  config:
    import: classpath:queueguard-observability.yml
  application:
    name: monitor-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:monitor_db}
    username: ${DB_USER:queueguard}
    password: ${DB_PASSWORD:queueguard}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

queueguard:
  targets: ${MONITOR_TARGETS:api-gateway=http://localhost:8080,auth-service=http://localhost:8081,queue-service=http://localhost:8082,worker-service=http://localhost:8083,rate-limit-service=http://localhost:8084}
  rate-limit-url: ${RATE_LIMIT_SERVICE_URL:http://localhost:8084}
  queue-url: ${QUEUE_SERVICE_URL:http://localhost:8082}
  probe-interval-ms: ${MONITOR_PROBE_INTERVAL_MS:10000}
  cleanup-interval-ms: ${MONITOR_CLEANUP_INTERVAL_MS:3600000}

logging:
  level:
    com.queueguard: INFO
